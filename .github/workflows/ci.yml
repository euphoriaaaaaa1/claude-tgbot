name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 固定版本：本地门禁与 CI 用同一 bun，避免运行时差异造成偶发红
          bun-version: "1.3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          # 验收用例会 import voicecall（可选模块），运行时依赖不在 requirements.txt。
          # python-multipart 是 voicecall 表单端点的运行时依赖，缺了会 7 条用例报错。
          python -m pip install fastapi httpx uvicorn python-multipart

      - name: Install Bun dependencies
        working-directory: dispatcher
        run: bun install --frozen-lockfile

      - name: Python import smoke
        # 本仓是发布模板，不带验收/单测套件；这里只验证所有随仓发布的模块能各自导入。
        run: python scripts/import_smoke.py

      - name: Bun tests
        # 只跑与实现同目录的调度器单测；独立测试目录已随发布瘦身移除。
        run: |
          fail=0
          while IFS= read -r f; do
            echo "== $f"
            bun test "$f" --timeout 120000 || fail=1
          done < <(find dispatcher -maxdepth 1 -name '*.test.ts' -type f \
                     -not -path '*/node_modules/*' | sort)
          exit $fail

      - name: Desensitization scan
        run: python scripts/scan_release.py
