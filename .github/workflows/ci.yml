name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 固定版本：本地门禁与 CI 用同一 bun，避免运行时差异造成偶发红
          bun-version: "1.3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          # 验收用例会 import voicecall（可选模块），运行时依赖不在 requirements.txt。
          # python-multipart 是 voicecall 表单端点的运行时依赖，缺了会 7 条用例报错。
          python -m pip install fastapi httpx uvicorn python-multipart

      - name: Install Bun dependencies
        working-directory: dispatcher
        run: bun install --frozen-lockfile

      - name: Python tests
        # 与 scripts/test-gate.sh 同样的范围：单元 + 验收；测试自身负责临时 HOME、
        # 假 Telegram、mock 服务与端口 0，不连真实 Telegram / 模型 / dsh。
        run: python -m pytest tests/unit tests/acceptance -q

      - name: Bun tests
        # 每个测试文件单独一个进程：bun 测试在模块加载期改 process.env，
        # 批量跑会让 CHANNEL_DIR/BOT_NAME 等互相污染（与 scripts/test-gate.sh 同口径）。
        run: |
          fail=0
          while IFS= read -r f; do
            echo "== $f"
            bun test "$f" --timeout 120000 || fail=1
          done < <(find dispatcher tests/acceptance -name '*.test.ts' -type f \
                     -not -path '*/node_modules/*' | sort)
          exit $fail

      - name: Desensitization scan
        run: python scripts/scan_release.py
