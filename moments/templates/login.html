<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · 面板</title>
<style>
/* 字体只用设备自带的，不加载任何站外字体（与 provider 页同一套正文字体栈）。 */
:root { --bg:#ededed; --card:#fff; --ink:#181818; --ink-soft:#555; --danger:#fa5151;
        --hairline:rgba(0,0,0,0.08); --wxgreen:#07c160;
        --font-body:'Noto Sans SC','Noto Sans CJK SC','Source Han Sans SC',-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#000; --card:#1c1c1e; --ink:#f0f0f0; --ink-soft:#c0c0c0; --hairline:rgba(255,255,255,0.1); }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font-body); background:var(--bg); color:var(--ink);
       min-height:100vh; display:flex; align-items:center; justify-content:center; }
.card { background:var(--card); border:1px solid var(--hairline); border-radius:14px;
        padding:28px 24px; width:min(360px, 90vw); }
h1 { font-size:18px; font-weight:600; margin-bottom:18px; }
label { display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
input[type=password] { width:100%; padding:10px 12px; border-radius:8px; font-size:16px;
        border:1px solid var(--hairline); background:transparent; color:var(--ink); }
button { margin-top:16px; width:100%; border:none; border-radius:8px; padding:11px;
        background:var(--wxgreen); color:#fff; font-size:15px; cursor:pointer; font-family:var(--font-body); }
.error { color:var(--danger); font-size:13px; margin-top:12px; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>面板登录</h1>
    <label for="password">口令</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">登录</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
